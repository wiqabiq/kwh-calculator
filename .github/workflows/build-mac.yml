
name: Build KWH Calculator for macOS

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build macOS application
        run: python -m PyInstaller --windowed --name "KWH Calculator" kwh_gui.py

      - name: Package application
        run: |
          cd dist
          zip -r "KWH-Calculator-macOS.zip" "KWH Calculator.app"

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: KWH-Calculator-macOS
          path: dist/KWH-Calculator-macOS.zip
